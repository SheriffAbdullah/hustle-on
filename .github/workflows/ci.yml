name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q hustleon.py hustleon_core.py hustleon_tray.py tests
      - name: Tests (powercfg / execution state / registry / battery are mocked)
        run: python -m pytest
      - name: PyInstaller build smoke test
        run: |
          python -m PyInstaller --noconfirm hustle-on.spec
          if (-not (Test-Path dist/hustle-on.exe)) { throw "exe not built" }
