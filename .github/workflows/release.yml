name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read version from pyproject.toml (single source)
        id: ver
        shell: python
        run: |
          import os, re
          v = re.search(r'(?m)^version\s*=\s*"([^"]+)"', open("pyproject.toml").read()).group(1)
          open("_version.py", "w").write("__version__ = %r\n" % v)
          open(os.environ["GITHUB_OUTPUT"], "a").write("version=%s\n" % v)
      - name: Tag must equal pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.ver.outputs.version }}") {
            throw "Tag ${{ github.ref_name }} does not match pyproject version ${{ steps.ver.outputs.version }}"
          }
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests (powercfg / execution state / registry / battery are mocked)
        run: python -m pytest
      - name: Build one-file exe with PyInstaller
        run: |
          python make_version_info.py
          python -m PyInstaller --noconfirm hustle-on.spec
          if (-not (Test-Path dist/hustle-on.exe)) { throw "exe not built" }
      - uses: actions/upload-artifact@v4
        with:
          name: hustle-on-${{ steps.ver.outputs.version }}
          path: dist/hustle-on.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hustle-on.exe
          generate_release_notes: true
